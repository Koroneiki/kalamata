name: Steam integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steam-live-integration
  cancel-in-progress: false

jobs:
  balatro:
    name: Balatro live download
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download and verify current Balatro content
        env:
          BALATRO_LIVE_INTEGRATION: '1'
        run: bun test test/balatro-live.test.ts
